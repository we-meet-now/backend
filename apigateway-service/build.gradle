plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.wemeetnow'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2023.0.3")
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-mvc'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks {
	processResources {
		duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.INCLUDE
	}
}

// -Pprofile=dev 로 전달된 값을 읽고, 없으면 기본값 "local" 사용
def profile = project.hasProperty('profile') ? project.property('profile') : 'local'

sourceSets {
	main {
		resources {
			// 기존 기본 resources 폴더도 포함하면서, 프로필별 폴더를 추가 리소스 디렉토리로 선언합니다.
			srcDirs = ["src/main/resources", "src/main/resources-env/${profile}"]
		}
	}
}

// 리소스 복사 시 파일명 중복 충돌 방지 전략을 EXCLUDE로 통일합니다.
tasks.named('processResources') {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

bootJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

springBoot {
	mainClass = 'com.wemeetnow.apigateway_service.ApigatewayServiceApplication'
}