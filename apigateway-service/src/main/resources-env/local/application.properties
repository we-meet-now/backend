# Server Configuration
server.port=8000

# Application Configuration
spring.application.name=apigateway-service

# 프론트엔드(Vercel/로컬) CORS 허용 Origin (쉼표로 복수 등록 가능)
front.url=https://front-azure-iota.vercel.app,http://localhost:5173

# ==========================================
# Spring Cloud Gateway MVC Routing Configuration
# ==========================================

# 1. Auth Service
spring.cloud.gateway.mvc.routes[0].id=auth-service
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:6112
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**

# 2. Chat Service
spring.cloud.gateway.mvc.routes[1].id=chat-service
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:6113
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/chat/**

# 3. AI Service
spring.cloud.gateway.mvc.routes[2].id=ai-service
spring.cloud.gateway.mvc.routes[2].uri=http://localhost:7111
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/docs/**, /api/ai/**

# ==========================================
# Eureka Client Configuration (Local)
# ==========================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# ??? ?? ?? ??? ?? ??
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true