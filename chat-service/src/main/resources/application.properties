# Config Location - Load profile-specific files from resources-env/{profile}/
spring.profiles.active=local
spring.profiles.include=db, auth
# Default Application Configuration
spring.application.name=chat-service
server.port=6113

front.url=http://localhost:5173
auth-service.url=http://localhost:6112
chat-service.url=http://localhost:6113

# JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.generate-ddl=false

# Logging
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

# Swagger-UI
springdoc.swagger-ui.path=/api/chat/v1/swagger-ui.html
springdoc.packages-to-scan=com.wemeetnow.chat_service.controller
springdoc.default-consumes-media-type=application/json;charset=UTF-8
springdoc.default-produces-media-type=application/json;charset=UTF-8
springdoc.api-docs.path=/api/chat/v1/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.override-with-generic-response=false

# External Services
external.auth-service.url=http://localhost:6112
